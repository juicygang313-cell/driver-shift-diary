<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дневник смен водителя</title>
<style>
  :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1a1a1a; }
  body { margin: 0 auto; padding: 16px; max-width: 900px; background: #f6f7f9; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  h2 { font-size: 1.05rem; margin: 20px 0 8px; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  button { padding: 6px 12px; border: 1px solid #cfd3da; border-radius: 6px; background: #fff; cursor: pointer; font: inherit; }
  button:hover { background: #eef1f5; }
  input, select { padding: 6px 8px; border: 1px solid #cfd3da; border-radius: 6px; font: inherit; background: #fff; }
  .days { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .days button.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .card { background: #fff; border: 1px solid #e3e6eb; border-radius: 8px; padding: 10px 12px; }
  .card .label { font-size: .8rem; color: #666; }
  .card .value { font-size: 1.25rem; font-weight: 600; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e3e6eb; border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eef0f3; }
  th { background: #f0f2f5; font-weight: 600; font-size: .85rem; }
  th.num, td.num { text-align: right; }
  td.empty { padding: 16px; color: #666; text-align: center; }
  form { background: #fff; border: 1px solid #e3e6eb; border-radius: 8px; padding: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  form label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; }
  form .actions { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .msg { font-size: .9rem; }
  .msg.error { color: #b42318; }
  .msg.ok { color: #067647; }
</style>
</head>
<body>
<h1>Дневник смен водителя</h1>

<div class="toolbar">
  <button id="prev" type="button" title="Предыдущий день">←</button>
  <input id="date" type="date">
  <button id="next" type="button" title="Следующий день">→</button>
</div>
<div id="days" class="days"></div>

<div class="cards">
  <div class="card"><div class="label">Поездок</div><div class="value" id="s-count">–</div></div>
  <div class="card"><div class="label">Выручка</div><div class="value" id="s-revenue">–</div></div>
  <div class="card"><div class="label">Комиссия</div><div class="value" id="s-commission">–</div></div>
  <div class="card"><div class="label">На руки</div><div class="value" id="s-net">–</div></div>
  <div class="card"><div class="label">Наличные</div><div class="value" id="s-cash">–</div></div>
  <div class="card"><div class="label">Карта</div><div class="value" id="s-card">–</div></div>
</div>

<table>
  <thead><tr><th>Время</th><th class="num">Сумма</th><th>Оплата</th><th class="num">Комиссия</th></tr></thead>
  <tbody id="trips"></tbody>
</table>

<h2>Добавить поездку</h2>
<form id="add">
  <label>Начало <input name="start" type="datetime-local" required></label>
  <label>Окончание <input name="end" type="datetime-local" required></label>
  <label>Часовой пояс <input name="tz" value="+05:00" pattern="[+\-]\d{2}:\d{2}" required></label>
  <label>Сумма <input name="amount" type="number" step="0.01" min="0.01" required></label>
  <label>Оплата
    <select name="payment"><option value="cash">наличные</option><option value="card">карта</option></select>
  </label>
  <label>Комиссия <input name="commission" type="number" step="0.01" min="0" value="0" required></label>
  <div class="actions">
    <button type="submit">Добавить</button>
    <span id="form-msg" class="msg"></span>
  </div>
</form>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const PAYMENT_LABEL = { cash: "наличные", card: "карта" };
  let current = null; // "YYYY-MM-DD"

  const pad = (n) => String(n).padStart(2, "0");
  const fmtDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const localToday = () => fmtDate(new Date());
  const shiftDay = (iso, delta) => {
    const [y, m, d] = iso.split("-").map(Number);
    return fmtDate(new Date(y, m - 1, d + delta));
  };
  // Time is sliced from the ISO string on purpose: `new Date()` would shift it
  // into the browser's time zone, but the trip's own offset is what the driver saw.
  const hhmm = (iso) => iso.slice(11, 16);
  const money = (n) => `${Number(n).toLocaleString("ru-RU")} ₽`;
  const setText = (id, text) => { $(id).textContent = text; };

  const api = async (path, options) => {
    const res = await fetch(path, options);
    return { status: res.status, body: await res.json() };
  };

  // GET paths only: any non-2xx response is an error (api() above keeps non-2xx
  // bodies because the submit handler needs the 409/422 details).
  const getJson = async (path) => {
    const res = await fetch(path);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  };
  const reasonOf = (err) => (/^HTTP \d+$/.test(err?.message) ? err.message : "нет связи с сервером");

  // All data goes into the DOM via textContent — never innerHTML.
  const renderDays = (days) => {
    const box = $("days");
    box.replaceChildren();
    for (const d of days) {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.date = d.date;
      b.textContent = `${d.date} (${d.trips_count})`;
      b.addEventListener("click", () => show(d.date));
      box.append(b);
    }
  };

  const markActiveDay = () => {
    for (const b of $("days").children) b.classList.toggle("active", b.dataset.date === current);
  };

  const renderSummary = (s) => {
    setText("s-count", s.trips_count);
    setText("s-revenue", money(s.revenue));
    setText("s-commission", money(s.commission));
    setText("s-net", money(s.net));
    setText("s-cash", `${money(s.by_payment.cash.amount)} · ${s.by_payment.cash.count}`);
    setText("s-card", `${money(s.by_payment.card.amount)} · ${s.by_payment.card.count}`);
  };

  // A single full-width row in the trips table: empty state and load errors.
  const renderTableMessage = (text) => {
    const tbody = $("trips");
    tbody.replaceChildren();
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 4;
    td.className = "empty";
    td.textContent = text;
    tr.append(td);
    tbody.append(tr);
  };

  const renderTrips = (trips) => {
    const tbody = $("trips");
    if (trips.length === 0) {
      renderTableMessage("Нет поездок");
      return;
    }
    tbody.replaceChildren();
    for (const t of trips) {
      const tr = document.createElement("tr");
      const cells = [
        [`${hhmm(t.start)}–${hhmm(t.end)}`, ""],
        [money(t.amount), "num"],
        [PAYMENT_LABEL[t.payment] ?? t.payment, ""],
        [money(t.commission), "num"],
      ];
      for (const [text, cls] of cells) {
        const td = document.createElement("td");
        td.textContent = text;
        if (cls) td.className = cls;
        tr.append(td);
      }
      tbody.append(tr);
    }
  };

  const loadDays = async () => {
    const days = await getJson("/api/days");
    renderDays(days);
    markActiveDay();
    return days;
  };

  // Fetch first; only a successful load moves `current` and the date input.
  const show = async (day) => {
    let trips, summary;
    try {
      [trips, summary] = await Promise.all([
        getJson(`/api/trips?date=${day}`),
        getJson(`/api/summary?date=${day}`),
      ]);
    } catch (err) {
      $("date").value = current ?? "";
      renderTableMessage(`Не удалось загрузить день (${reasonOf(err)})`);
      return;
    }
    current = day;
    $("date").value = day;
    markActiveDay();
    renderTrips(trips);
    renderSummary(summary);
  };

  $("prev").addEventListener("click", () => show(shiftDay(current ?? localToday(), -1)));
  $("next").addEventListener("click", () => show(shiftDay(current ?? localToday(), 1)));
  $("date").addEventListener("change", (e) => { if (e.target.value) show(e.target.value); });

  // datetime-local gives "YYYY-MM-DDTHH:MM" (or with :SS); add seconds and the offset.
  const withOffset = (local, tz) => (local.length === 16 ? `${local}:00` : local) + tz;

  $("add").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const f = new FormData(form);
    const tz = f.get("tz");
    const body = {
      start: withOffset(f.get("start"), tz),
      end: withOffset(f.get("end"), tz),
      amount: f.get("amount"),
      payment: f.get("payment"),
      commission: f.get("commission"),
    };
    const msg = $("form-msg");
    msg.className = "msg";
    msg.textContent = "";
    try {
      const res = await api("/api/trips", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (res.status === 201 || res.status === 200) {
        msg.classList.add("ok");
        msg.textContent = res.status === 201 ? "Поездка добавлена" : "Такая поездка уже есть";
        if (res.status === 201) form.reset();
        await loadDays();
        await show(res.body.start.slice(0, 10));
      } else if (res.status === 422) {
        const err = res.body.detail?.[0];
        msg.classList.add("error");
        const field = err?.loc?.at(-1);
        msg.textContent = !err ? "Ошибка валидации"
          : (field && field !== "body") ? `${field}: ${err.msg}` : err.msg;
      } else if (res.status === 409) {
        msg.classList.add("error");
        msg.textContent = "Поездка с таким id уже есть, но с другими данными";
      } else {
        msg.classList.add("error");
        msg.textContent = `Ошибка ${res.status}`;
      }
    } catch {
      // Network failure or a non-JSON body (res.json() rejects). Reset the class
      // too, so a success class set above cannot colour this error green.
      msg.className = "msg error";
      msg.textContent = "Нет связи с сервером";
    }
  });

  (async () => {
    try {
      const days = await loadDays();
      await show(days.length ? days[days.length - 1].date : localToday());
    } catch (err) {
      renderTableMessage(`Не удалось загрузить дни (${reasonOf(err)})`);
    }
  })();
})();
</script>
</body>
</html>
